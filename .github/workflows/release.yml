name: Section 11 release package
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Reviewed full source SHA for first release; blank uses this main commit'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: section11-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source: ${{ steps.source.outputs.commit }}
      ready: ${{ steps.source.outputs.ready }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      S11_TEST_BUDGET_START: '2026-10-28T12:00:00+00:00'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Select immutable source
        id: source
        env:
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          requested = os.environ.get('REQUESTED_SOURCE', '')
          ready = bool(requested) or not Path('trusted/.github/release-runtime').exists()
          commit = requested or os.environ['GITHUB_SHA']
          if not re.fullmatch('[0-9a-f]{40}', commit):
              raise SystemExit('Supply the full reviewed source commit, never a branch or tag.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + commit + '\nready=' + str(ready).lower() + '\n')
          if not ready:
              print('First-release preparation only: main entry remains old; dispatch the reviewed sealed source SHA.')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.source.outputs.ready == 'true'
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.source.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - if: steps.source.outputs.ready == 'true'
        run: python -m pip install requests
      - name: Verify source with main-owned publisher
        if: steps.source.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PINNED_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          release_tools=trusted
          if [ -d trusted/.github/release-runtime ]; then release_tools=trusted/.github/release-runtime; fi
          python "$release_tools/examples/maintenance/publish_release.py" --source release-source --commit "$PINNED_COMMIT" --verify-only
      - name: Offline suite
        if: steps.source.outputs.ready == 'true'
        working-directory: release-source
        run: python -I -B -m unittest discover dev/tests
  publish:
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Build, tag, draft, upload, read back and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PINNED_COMMIT: ${{ needs.verify.outputs.source }}
        run: |
          release_tools=trusted
          if [ -d trusted/.github/release-runtime ]; then release_tools=trusted/.github/release-runtime; fi
          python "$release_tools/examples/maintenance/publish_release.py" --source release-source --commit "$PINNED_COMMIT"
