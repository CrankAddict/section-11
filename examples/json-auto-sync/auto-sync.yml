name: Auto-Sync Intervals.icu Data

on:
  schedule:
    # Every 30 minutes, at :07 and :37 UTC (away from the busy top of the hour).
    # GitHub runs schedules best-effort; for an immediate sync, use Run workflow (Sync Now).
    # For Fast mode and hybrid schedules, see examples/json-auto-sync/SETUP.md in Section 11.
    - cron: '7,37 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: section11-data-sync
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    # A sync normally finishes in under a minute; this stops a stuck run from using up Actions minutes.
    timeout-minutes: 15

    steps:
      - name: Verify default branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Scheduled runs always use the default branch; their event carries no repository details.
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "✅ Scheduled run on the default branch"
            exit 0
          fi
          if [ -z "$DEFAULT_BRANCH" ] || [ "$RUN_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "❌ ERROR: This workflow only syncs and publishes from the default branch."
            echo "Start it again and select the default branch under Run workflow."
            exit 1
          fi
          echo "✅ Running on the default branch"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use the branch as it is when this job starts, not the commit from when the run was queued,
          # so a run that waited behind another sync builds on that sync's commit.
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Verify sync.py exists
        run: |
          if [ ! -f sync.py ]; then
            echo "❌ ERROR: sync.py not found in the repository root!"
            exit 1
          fi
          echo "✅ sync.py found"
          echo "File size: $(wc -c < sync.py) bytes"

      - name: Verify secrets are set
        env:
          ATHLETE_ID: ${{ secrets.ATHLETE_ID }}
          INTERVALS_KEY: ${{ secrets.INTERVALS_KEY }}
        run: |
          if [ -z "$ATHLETE_ID" ]; then
            echo "❌ ERROR: ATHLETE_ID secret not set!"
            exit 1
          fi
          if [ -z "$INTERVALS_KEY" ]; then
            echo "❌ ERROR: INTERVALS_KEY secret not set!"
            exit 1
          fi
          echo "✅ All secrets configured"

      - name: Run sync
        env:
          ATHLETE_ID: ${{ secrets.ATHLETE_ID }}
          INTERVALS_KEY: ${{ secrets.INTERVALS_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          WEEK_START: ${{ secrets.WEEK_START }}
          ZONE_PREFERENCE: ${{ secrets.ZONE_PREFERENCE }}
        run: |
          # sync.py prints the first five characters of both credentials; hide them in the log.
          echo "::add-mask::${ATHLETE_ID:0:5}"
          echo "::add-mask::${INTERVALS_KEY:0:5}"
          echo "🔍 Debug info:"
          echo "  Python version: $(python --version)"
          echo "  Working directory: $(pwd)"
          echo "  GITHUB_REPO: $GITHUB_REPO"
          echo ""
          echo "🚀 Running sync script..."
          # Single-writer mode: generate files locally and let this workflow commit them.
          # Avoid sync.py GitHub API publishing here, because the publish step below
          # commits the checkout copies of the generated files.
          python sync.py \
            --athlete-id "$ATHLETE_ID" \
            --intervals-key "$INTERVALS_KEY" \
            --days 7 \
            --output latest.json || {
              echo "❌ Sync script failed with exit code $?"
              exit 1
            }

      - name: Verify generated data
        run: |
          if [ ! -f latest.json ]; then
            echo "❌ latest.json not found"
            exit 1
          fi
          if ! python -m json.tool latest.json > /dev/null; then
            echo "❌ latest.json is not valid JSON"
            exit 1
          fi
          # A successful sync always rewrites latest.json, so an unchanged tracked copy means nothing was written.
          if git cat-file -e HEAD:latest.json 2> /dev/null; then
            git show HEAD:latest.json > "$RUNNER_TEMP/tracked-latest.json"
            if cmp -s "$RUNNER_TEMP/tracked-latest.json" latest.json; then
              echo "❌ latest.json was not updated by this sync"
              exit 1
            fi
          fi
          for f in history.json intervals.json routes.json saved_workouts.json ftp_history.json; do
            if [ -f "$f" ] && ! python -m json.tool "$f" > /dev/null; then
              echo "❌ $f is not valid JSON"
              exit 1
            fi
          done
          echo "✅ Generated data verified"
          echo "latest.json size: $(wc -c < latest.json) bytes"

      - name: Upload data files for download
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: training-data
          path: |
            latest.json
            history.json
            intervals.json
            routes.json
            saved_workouts.json
            ftp_history.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish data and update README
        env:
          RUN_BRANCH: ${{ github.ref_name }}
        run: |
          GENERATED=(latest.json history.json intervals.json routes.json saved_workouts.json ftp_history.json)
          NOW=$(date -u +%s)
          SYNC_TIME=$(date -u -d "@${NOW}" +"%Y-%m-%d %H:%M:%S UTC")
          ARCHIVE_PATH="archive/$(date -u -d "@${NOW}" +"%Y-%m")/$(date -u -d "@${NOW}" +"%Y-%m-%d").json"
          CHECKOUT_SHA=$(git rev-parse HEAD)

          # Publish only to the repository's default branch, and only from a run on that branch.
          if ! REMOTE_HEAD=$(git ls-remote --symref origin HEAD); then
            echo "❌ ERROR: Could not read the repository's default branch. Nothing was published."
            exit 1
          fi
          TARGET_BRANCH=$(printf '%s\n' "$REMOTE_HEAD" | sed -n 's#^ref: refs/heads/\(.*\)[[:space:]]HEAD$#\1#p')
          if [ -z "$TARGET_BRANCH" ] || [ "$TARGET_BRANCH" != "$RUN_BRANCH" ]; then
            echo "❌ ERROR: Could not confirm that this run is on the default branch. Nothing was published."
            exit 1
          fi

          # Keep this run's output outside the working tree while the tree is reset.
          STAGE_DIR="$RUNNER_TEMP/section11-output"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          SAVED=()
          for f in "${GENERATED[@]}"; do
            if [ -f "$f" ]; then
              cp -p "$f" "$STAGE_DIR/$f"
              SAVED+=("$f")
            fi
          done

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          MAX_ATTEMPTS=3
          ATTEMPT=1
          PUSHED=()
          git fetch --quiet --depth=1 origin "refs/heads/${TARGET_BRANCH}"
          UPSTREAM_SHA=$(git rev-parse FETCH_HEAD)
          while true; do
            # Fail closed if generated data changed in the repository after checkout.
            # Reached only before any push, or after a read-back confirmed no commit from this run is on the branch.
            CHANGED=$(git diff --name-only "$CHECKOUT_SHA" "$UPSTREAM_SHA" -- "${GENERATED[@]}" "$ARCHIVE_PATH")
            if [ -n "$CHANGED" ]; then
              echo "❌ ERROR: Generated data changed in the repository during this run. Nothing was published."
              echo "Changed files:"
              printf '%s\n' "$CHANGED" | sed 's/^/  /'
              echo "The next run syncs again from the updated repository."
              exit 1
            fi

            # Rebuild the commit on the latest default branch so other changes are kept.
            git reset --quiet --hard "$UPSTREAM_SHA"
            for f in "${SAVED[@]}"; do
              cp -p "$STAGE_DIR/$f" "$f"
            done

            # One archive file per UTC day, overwritten by later runs that day.
            mkdir -p "$(dirname "$ARCHIVE_PATH")"
            cp latest.json "$ARCHIVE_PATH"
            echo "✅ Archived to ${ARCHIVE_PATH}"

            if [ -f README.md ]; then
              if grep -q "Last successful sync:" README.md; then
                echo "Found existing timestamp line, updating..."
                sed -i "s/\*\*Last successful sync:\*\*.*/\*\*Last successful sync:\*\* ${SYNC_TIME}/" README.md
              else
                echo "No timestamp found, adding new line..."
                sed -i "/badge.svg)/a\\\n\*\*Last successful sync:\*\* ${SYNC_TIME}\n" README.md
              fi
              git add -- README.md
            fi

            git add -- "${SAVED[@]}" "$ARCHIVE_PATH"
            if [ -n "$(git ls-files --unmerged)" ]; then
              echo "❌ ERROR: Unresolved changes in the working tree. Nothing was published."
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "⏭️  No changes to publish"
              exit 0
            fi
            git commit --quiet -m "Sync training data - ${SYNC_TIME}"
            LOCAL_SHA=$(git rev-parse HEAD)
            echo "Pushing commit ${LOCAL_SHA} built on ${UPSTREAM_SHA} (attempt ${ATTEMPT})"

            if git push --quiet origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "✅ Data, archive and README published in one commit (attempt ${ATTEMPT})"
              break
            fi
            PUSHED+=("$LOCAL_SHA")

            # The push did not report success, but it may still have landed.
            # Read the branch back with full ancestry (no --depth) before deciding whether to retry.
            echo "⚠️ Push did not report success (attempt ${ATTEMPT}). Reading the branch back before any retry..."
            if ! git fetch --quiet origin "refs/heads/${TARGET_BRANCH}" || ! REMOTE_SHA=$(git rev-parse --verify --quiet FETCH_HEAD); then
              echo "❌ OUTCOME UNKNOWN: The branch could not be read back after the push."
              echo "The commit from this run may or may not have landed. No retry was made."
              echo "Check the latest commit on ${TARGET_BRANCH} before running the workflow again."
              exit 2
            fi
            APPLIED=""
            for c in "${PUSHED[@]}"; do
              if [ "$c" = "$REMOTE_SHA" ]; then
                APPLIED="exact"
                break
              fi
              RC=0
              git merge-base --is-ancestor "$c" "$REMOTE_SHA" || RC=$?
              if [ "$RC" -eq 0 ]; then
                APPLIED="ancestor"
                break
              elif [ "$RC" -ne 1 ]; then
                echo "❌ OUTCOME UNKNOWN: Could not determine whether this run's commit is on ${TARGET_BRANCH}."
                echo "The commit from this run may or may not have landed. No retry was made."
                echo "Check the latest commit on ${TARGET_BRANCH} before running the workflow again."
                exit 2
              fi
            done
            if [ "$APPLIED" = "exact" ]; then
              echo "✅ The push response failed, but commit ${c} was verified as the current head of ${TARGET_BRANCH}."
              echo "✅ Data, archive and README are published."
              break
            fi
            if [ "$APPLIED" = "ancestor" ]; then
              echo "✅ The push response failed, but commit ${c} was verified in the history of ${TARGET_BRANCH}, which has since moved on."
              echo "✅ Data, archive and README are published."
              break
            fi

            # Read-back confirmed that no commit from this run is on the branch.
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "❌ ERROR: The push was not accepted after ${MAX_ATTEMPTS} attempts."
              echo "Read-back confirmed that no commit from this run is on ${TARGET_BRANCH}."
              exit 1
            fi
            echo "⚠️ Read-back confirmed the commit is not on ${TARGET_BRANCH}. Retrying with the latest repository state..."
            sleep $((ATTEMPT * 5))
            ATTEMPT=$((ATTEMPT + 1))
            UPSTREAM_SHA="$REMOTE_SHA"
          done

      - name: Show result
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_BRANCH: ${{ github.ref_name }}
        run: |
          echo "✅ Sync completed successfully!"
          echo "📊 View data: https://raw.githubusercontent.com/${REPOSITORY}/${RUN_BRANCH}/latest.json"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::⚠️ Sync failed! Check the logs above for details."
          echo "Common issues:"
          echo "  - Manual run started from a branch other than the default branch"
          echo "  - Check ATHLETE_ID and INTERVALS_KEY secrets"
          echo "  - Verify Intervals.icu API is accessible"
          echo "  - Generated data missing, invalid, or not updated by sync.py"
          echo "  - Generated data changed in the repository during the run (the next run syncs again)"
          echo "  - Push rejected or not permitted: check workflow permissions"
